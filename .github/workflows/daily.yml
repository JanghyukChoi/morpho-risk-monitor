name: daily

# 매일 스냅샷을 적재하고 모니터 페이지를 다시 굽는다.
# 건너뛴 날은 복구가 안 된다 — 마켓 상태는 시점 데이터라 소급이 불가능하다.
# ⚠ GitHub 의 cron 은 **보장되지 않는다.** 부하가 높으면 지연되거나 건너뛴다.
#   실제로 2026-09-20 예정분이 통째로 누락됐다(수동 1회만 기록됨).
#   놓친 날은 복구가 안 된다 — 마켓 상태는 시점 데이터다.
#   → 하루 3회로 이중화한다. snapshot.py 는 날짜 단위 멱등이라 중복은 무해하다.
on:
  schedule:
    - cron: "17 1 * * *"      # 01:17 UTC
    - cron: "43 9 * * *"      # 09:43 UTC
    - cron: "29 17 * * *"     # 17:29 UTC
  workflow_dispatch:           # 수동 실행도 가능

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # ★ 소스 하나가 죽어도 모니터 전체가 죽으면 안 된다.
      #   실제로 공개 RPC 가 GitHub 러너 IP 를 막아 재스테이킹 수집이 실패했고
      #   그 때문에 페이지 갱신·커밋까지 통째로 건너뛰었다(2026-09-20 run #3,#4).
      #   각 수집은 실패해도 계속 가고, 페이지는 있는 데이터로 굽는다.
      - name: collect morpho
        continue-on-error: true
        run: python curator/snapshot.py
      - name: collect restaking
        continue-on-error: true
        run: python restake/snapshot_restake.py
      - name: build page
        run: python curator/build_site.py
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ data_restake/ index.html
          git diff --staged --quiet || git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
          git push
